; OAT Soil-Moisture Node — firmware build
; -----------------------------------------------------------------------------
; Four boards. Every OAT sketch is split by SENSOR, never by chip: the .ino carries
; a per-chip ADC1 pin table (default pin + refusal reasons), so adding a chip is an
; env here plus a pin table entry, not a second sketch. Classic ESP32 is the bench
; board; the S3 / C3 / C6 images are beta until a reading from each has reached the
; Test Endpoint.
;
; merge_bin.py turns the env's artifacts into a single firmware-esp32.bin
; flashable at offset 0; build.sh assembles that plus manifest.json into the site
; assets for the browser installer.
;
; PLATFORM PIN: pioarduino's espressif32 tracks Arduino-ESP32 3.x (ESP-IDF 5.x),
; the same pin every other sketch in this library uses.

[platformio]
src_dir = .
default_envs = esp32, esp32-s3, esp32-c3, esp32-c6

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
; huge_app is what every sketch in this library builds with, so a partition
; layout is never the variable when something differs. No OTA slot: this
; firmware reflashes from the browser.
board_build.partitions = huge_app.csv
; DIO on purpose: QIO is not a valid ROM boot mode on every board.
board_build.flash_mode = dio
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
extra_scripts = post:merge_bin.py
; shared OAT modules live one level up at firmware/lib (oat_node_core, oat_ods, oat_sign)
lib_extra_dirs = ../lib
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.2.0
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DMQTT_MAX_PACKET_SIZE=2048
    -DOAT_MAX_SLOTS=6           ; six ADC1 pins, six probes
    -DOAT_MEAS_PER_SLOT=2       ; voltage + soil_moisture

; ---- Classic ESP32 (external USB-UART bridge: CP2102 / CH340 -> may need a driver) ----
[env:esp32]
board = esp32dev

; ---- ESP32-S3 (native USB) ----
[env:esp32-s3]
board = esp32-s3-devkitc-1

; ---- ESP32-C3 (native USB; the value pick) ----
[env:esp32-c3]
board = esp32-c3-devkitm-1
build_flags = ${env.build_flags} -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

; ---- ESP32-C6 (native USB) ----
[env:esp32-c6]
board = esp32-c6-devkitc-1
build_flags = ${env.build_flags} -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
