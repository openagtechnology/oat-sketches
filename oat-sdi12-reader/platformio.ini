; OAT SDI-12 Reader — multi-chip firmware build
; -----------------------------------------------------------------------------
; Reads SDI-12 sensors (the open digital bus on Apogee/Meter/etc. instruments)
; and pushes each reading to a user-designated endpoint as oat-ods, by WEBHOOK or
; MQTT. Same web-installer + merge_bin pipeline as the BLE listener: ONE merged
; factory image per chip family; make_manifest.py + build.sh assemble the site
; payload. The grower never picks a chip or edits code.
;
; Capability filter: needs WiFi (any of these chips) + one GPIO for the SDI-12
; bus. No BLE, so the dependency set is smaller than the listener's.
;
; PLATFORM PIN — VERIFY ON FIRST BUILD: pioarduino's espressif32 tracks
; Arduino-ESP32 3.x (ESP-IDF 5.x), bringing C3/C6/S3 native USB. Confirm the
; latest release tag at
;   https://github.com/pioarduino/platform-espressif32/releases
; and bump the URL below if the build can't resolve it.

[platformio]
src_dir = .
default_envs = esp32, esp32-s3, esp32-c3, esp32-c6

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
extra_scripts = post:merge_bin.py
; shared OAT encoder module lives one level up at firmware/lib/oat_ods
lib_extra_dirs = ../lib
lib_deps =
    envirodiy/SDI-12 @ ^2.2.0
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.2.0
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DMQTT_MAX_PACKET_SIZE=2048

; ---- Classic ESP32 (external USB-UART bridge: CP2102 / CH340 -> may need a driver) ----
[env:esp32]
board = esp32dev

; ---- ESP32-S3 (native USB, no driver) ----
[env:esp32-s3]
board = esp32-s3-devkitc-1

; ---- ESP32-C3 (native USB, no driver) ----
[env:esp32-c3]
board = esp32-c3-devkitm-1

; ---- ESP32-C6 (native USB, no driver; WiFi 6) ----
[env:esp32-c6]
board = esp32-c6-devkitc-1
