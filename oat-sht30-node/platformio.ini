; OAT SHT-30 Node — firmware build
; -----------------------------------------------------------------------------
; ONE board on purpose: the classic ESP32. This sketch was cut for the board on
; the bench, and every OAT sketch is split by SENSOR, never by chip — so adding
; the S3 / C3 / C6 later is an env in this file plus a pin default, not a second
; sketch. The pin advice in the .ino header is classic-ESP32 specific; the other
; chips number their pins differently and would need their own default pair.
;
; merge_bin.py turns the env's artifacts into a single firmware-esp32.bin
; flashable at offset 0; build.sh assembles that plus manifest.json into the site
; assets for the browser installer.
;
; PLATFORM PIN: pioarduino's espressif32 tracks Arduino-ESP32 3.x (ESP-IDF 5.x),
; the same pin every other sketch in this library uses. Confirm the latest release
; tag at https://github.com/pioarduino/platform-espressif32/releases and bump the
; URL below if the build can't resolve it.

[platformio]
src_dir = .
default_envs = esp32

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
; This firmware is far smaller than the BLE listener (no BLE stack, no decoder),
; but huge_app is kept for one reason: it is what every sketch in this library
; builds with, so a partition layout is never the variable when something differs.
; No OTA slot, which is right — this firmware reflashes from the browser.
board_build.partitions = huge_app.csv
; Force DIO flash mode. The classic ESP32 already defaults to DIO, so this is a
; no-op here, but it is pinned in every OAT sketch because QIO is not a valid ROM
; *boot* mode: a board whose flash cannot be read back in QIO flashes fine and
; then loops at the ROM stage (rst:0x7 TG0_WDT, never reaching the app).
board_build.flash_mode = dio
; Pin a 4 MB flash-size header. An image header claiming more flash than the chip
; has fails the boot-time flash probe and panics. 4 MB matches huge_app.csv and
; boots on any board with >= 4 MB.
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
extra_scripts = post:merge_bin.py
; shared OAT modules live one level up at firmware/lib (oat_ods, oat_sign)
lib_extra_dirs = ../lib
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.2.0
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DMQTT_MAX_PACKET_SIZE=2048
    -DOAT_MAX_SLOTS=2           ; the SHT-30 has exactly two addresses
    -DOAT_MEAS_PER_SLOT=2       ; temperature + humidity

; ---- Classic ESP32 (external USB-UART bridge: CP2102 / CH340 -> may need a driver) ----
[env:esp32]
board = esp32dev
