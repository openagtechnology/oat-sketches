; OAT LoRa Gateway — one merged factory image per Heltec board.
; See oat-lora-field-node/platformio.ini for the board/chip reasoning. The gateway
; links oat_node_core (Wi-Fi, setup page, push engine), so it carries the core's
; deps too. Slot table sized for a campus: 96 sensors x 6 measurands.
[platformio]
src_dir = .
default_envs = heltec-v3, heltec-v4, heltec-v2

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
board_build.flash_mode = dio
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
extra_scripts = post:merge_bin.py
lib_extra_dirs = ../lib
lib_deps =
    jgromes/RadioLib @ ^7.1.0
    olikraus/U8g2 @ ^2.36.0
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.2.0
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DMQTT_MAX_PACKET_SIZE=2048
    -DOAT_MAX_SLOTS=64
    -DOAT_MEAS_PER_SLOT=6

; ---- Heltec WiFi LoRa 32 V3: ESP32-S3 + SX1262 (native USB) — the recommended gateway board ----
[env:heltec-v3]
board = heltec_wifi_lora_32_V3
build_flags = ${env.build_flags} -DOAT_BOARD_HELTEC_V3 -DARDUINO_USB_CDC_ON_BOOT=1

; ---- Heltec WiFi LoRa 32 V2 / V2.1: classic ESP32 + SX1276 ----
; The classic chip's static DRAM cannot hold the campus table (the link overflowed
; by 94 KB at 96 slots / 32 x 40), so the V2 gateway is the small-farm size:
; 12 nodes x 24 sensors, 48 slots. Plenty for one house; use the V3 for a campus.
[env:heltec-v2]
board = heltec_wifi_lora_32_V2
build_flags = ${env.build_flags} -DOAT_BOARD_HELTEC_V2 -UOAT_MAX_SLOTS -DOAT_MAX_SLOTS=48 -DOAT_MAX_UNITS=12 -DOAT_MAX_SUBS=24

; ---- Heltec WiFi LoRa 32 V4: ESP32-S3 + SX1262 + RF front-end module (PA/LNA) ----
; Same chip family as the V3 (the installer cannot tell them apart), a different
; radio path: the front end must be powered and driven or the board is deaf and
; mute. There is no V4 board definition in this platform release; the V3's
; (ESP32-S3, native USB) is the right base and the pin map comes from our header.
[env:heltec-v4]
board = heltec_wifi_lora_32_V3
build_flags = ${env.build_flags} -DOAT_BOARD_HELTEC_V4 -DARDUINO_USB_CDC_ON_BOOT=1
