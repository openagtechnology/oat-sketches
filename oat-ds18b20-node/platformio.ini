; OAT DS18B20 Node — firmware build
; -----------------------------------------------------------------------------
; Four boards, one sketch: every OAT sketch is split by SENSOR, never by chip.
; 1-Wire needs a single data pin, and the default differs per chip because the
; unusable pins differ per chip (see DEFAULT_OW_PIN and pinOkForOneWire in the
; .ino). Classic ESP32 is the board the wiring advice is written for; the others
; compile from the same source and are badged honestly on the site.
;
; merge_bin.py turns the env's artifacts into a single firmware-esp32.bin
; flashable at offset 0; build.sh assembles that plus manifest.json into the site
; assets for the browser installer.
;
; PLATFORM PIN: pioarduino's espressif32 tracks Arduino-ESP32 3.x (ESP-IDF 5.x),
; the same pin every other sketch in this library uses. Confirm the latest release
; tag at https://github.com/pioarduino/platform-espressif32/releases and bump the
; URL below if the build can't resolve it.

[platformio]
src_dir = .
default_envs = esp32, esp32-s3, esp32-c3, esp32-c6

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
; This firmware is far smaller than the BLE listener (no BLE stack, no decoder),
; but huge_app is kept for one reason: it is what every sketch in this library
; builds with, so a partition layout is never the variable when something differs.
; No OTA slot, which is right — this firmware reflashes from the browser.
board_build.partitions = huge_app.csv
; Force DIO flash mode. The classic ESP32 already defaults to DIO, so this is a
; no-op here, but it is pinned in every OAT sketch because QIO is not a valid ROM
; *boot* mode: a board whose flash cannot be read back in QIO flashes fine and
; then loops at the ROM stage (rst:0x7 TG0_WDT, never reaching the app).
board_build.flash_mode = dio
; Pin a 4 MB flash-size header. An image header claiming more flash than the chip
; has fails the boot-time flash probe and panics. 4 MB matches huge_app.csv and
; boots on any board with >= 4 MB.
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
extra_scripts = post:merge_bin.py
; shared OAT modules live one level up at firmware/lib (oat_ods, oat_sign)
lib_extra_dirs = ../lib
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.2.0
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DMQTT_MAX_PACKET_SIZE=2048
    -DOAT_MAX_SLOTS=10          ; one per probe, matching MAX_DS in the sketch
    -DOAT_MEAS_PER_SLOT=1       ; a DS18B20 measures temperature and nothing else

; ---- Classic ESP32 (external USB-UART bridge: CP2102 / CH340 -> may need a driver) ----
[env:esp32]
board = esp32dev

; USB CDC on the USB-Serial/JTAG chips (C3/C6): ARDUINO_USB_CDC_ON_BOOT puts `Serial`
; — the two-way setup Console AND the logs — on the USB port the user already plugged
; in. Without it Serial falls back to the UART pins, so the Console is unreachable and
; the log never appears. (S3 left on its default; it uses USB-OTG, a separate path.)

; ---- ESP32-S3 (native USB, no driver) ----
[env:esp32-s3]
board = esp32-s3-devkitc-1

; ---- ESP32-C3 (native USB, no driver) ----
[env:esp32-c3]
board = esp32-c3-devkitm-1
build_flags = ${env.build_flags} -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

; ---- ESP32-C6 (native USB, no driver; WiFi 6) ----
[env:esp32-c6]
board = esp32-c6-devkitc-1
build_flags = ${env.build_flags} -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
