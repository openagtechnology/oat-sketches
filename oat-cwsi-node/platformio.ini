; OAT CWSI Node — canopy-temperature node (MLX90614, I2C) -> oat-ods.
; Reports canopy temp, air temp, and the canopy-air delta (the core water-stress
; signal); CWSI itself is derived downstream where VPD is known. Same web-installer
; + merge_bin pipeline as the other sketches.
;
; PLATFORM PIN — VERIFY ON FIRST BUILD: bump the pioarduino release tag if the
; build can't resolve the platform (see the other sketches).

[platformio]
src_dir = .
default_envs = esp32, esp32-s3, esp32-c3, esp32-c6

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
extra_scripts = post:merge_bin.py
lib_extra_dirs = ../lib
lib_deps =
    adafruit/Adafruit MLX90614 Library @ ^2.1.5
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.2.0
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DMQTT_MAX_PACKET_SIZE=2048

[env:esp32]
board = esp32dev
[env:esp32-s3]
board = esp32-s3-devkitc-1
[env:esp32-c3]
board = esp32-c3-devkitm-1
[env:esp32-c6]
board = esp32-c6-devkitc-1
