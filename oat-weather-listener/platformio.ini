; OAT Weather-Station Listener — one merged factory image per board.
;
; The radio is a CC1101 transceiver (or the SX1276 already on a Heltec V2), driven
; by rtl_433_ESP: the ESP32 port of the rtl_433 project's decoders, ~220 on-off-
; keying device types (Acurite, La Crosse, Oregon Scientific, the Fine Offset /
; Ecowitt / Ambient sensor family ...). OOK and FSK cannot be demodulated at once
; by these chips, so the shipped images are OOK; an FSK build (Ecowitt WS80/WS90
; ultrasonic arrays) is the same source with -DOOK_MODULATION=false.
;
; The receive FREQUENCY is a runtime setting (band on the setup page: 433.92 or
; 915.00); RF_MODULE_FREQUENCY below is only the boot default.
[platformio]
src_dir = .
default_envs = esp32, esp32-s3, esp32-c3, esp32-c6, heltec-v2, heltec-v3, ibc-v102, ibc-v102-cc1101

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
board_build.flash_mode = dio
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
extra_scripts = post:merge_bin.py
lib_extra_dirs = ../lib
lib_deps =
    https://github.com/1technophile/Arduino-Log.git#d13cd80aa02c8cf79a33ca24c554ed3331c3679f
    https://github.com/NorthernMan54/rtl_433_ESP.git
    jgromes/RadioLib @ ^7.7.1
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.2.0
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DMQTT_MAX_PACKET_SIZE=2048
    -DOAT_MAX_SLOTS=32
    -DOAT_MEAS_PER_SLOT=8
    '-DLOG_LEVEL=LOG_LEVEL_NOTICE'
    '-DRF_MODULE_FREQUENCY=433.92'
    '-DOOK_MODULATION=true'
    '-DRSSI_THRESHOLD=9'

; ---- Classic ESP32 devkit + CC1101 on the standard SPI pins ----
; SCK 18 · MISO 19 · MOSI 23 · CS 5 · GDO0 22 · GDO2 4 · 3V3 · GND
[env:esp32]
board = esp32dev
build_flags = ${env.build_flags} '-DRF_CC1101="CC1101"' -DRF_MODULE_CS=5 -DRF_MODULE_GDO0=22 -DRF_MODULE_GDO2=4 -DOAT_BOARD_NAME='"ESP32 + CC1101"'

; ---- ESP32-S3 devkit + CC1101 ----
; SCK 12 · MISO 13 · MOSI 11 · CS 10 · GDO0 9 · GDO2 8
[env:esp32-s3]
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags} '-DRF_CC1101="CC1101"' -DRF_MODULE_SCK=12 -DRF_MODULE_MISO=13 -DRF_MODULE_MOSI=11 -DRF_MODULE_CS=10 -DRF_MODULE_GDO0=9 -DRF_MODULE_GDO2=8 -DARDUINO_USB_CDC_ON_BOOT=1 -DOAT_BOARD_NAME='"ESP32-S3 + CC1101"'

; ---- ESP32-C3 devkit + CC1101 on the C3's default SPI pins ----
; SCK 4 · MISO 5 · MOSI 6 · CS 7 · GDO0 10 · GDO2 3
[env:esp32-c3]
board = esp32-c3-devkitm-1
build_flags = ${env.build_flags} '-DRF_CC1101="CC1101"' -DRF_MODULE_SCK=4 -DRF_MODULE_MISO=5 -DRF_MODULE_MOSI=6 -DRF_MODULE_CS=7 -DRF_MODULE_GDO0=10 -DRF_MODULE_GDO2=3 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1 -DOAT_BOARD_NAME='"ESP32-C3 + CC1101"'

; ---- ESP32-C6 devkit + CC1101 on the C6's default SPI pins ----
; SCK 6 · MISO 2 · MOSI 7 · CS 18 · GDO0 10 · GDO2 11
; rtl_433_ESP names the bus VSPI on chips it does not list (C3/S3/C5 get FSPI); the
; C6 core has no VSPI, so the flag below aliases it to the C6's FSPI.
[env:esp32-c6]
board = esp32-c6-devkitc-1
build_flags = ${env.build_flags} '-DRF_CC1101="CC1101"' -DRF_MODULE_SCK=6 -DRF_MODULE_MISO=2 -DRF_MODULE_MOSI=7 -DRF_MODULE_CS=18 -DRF_MODULE_GDO0=10 -DRF_MODULE_GDO2=11 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1 -DVSPI=FSPI -DOAT_BOARD_NAME='"ESP32-C6 + CC1101"'

; ---- Heltec WiFi LoRa 32 V2: its own SX1276 does OOK, no extra module ----
; The 915 MHz variant of the board hears the Ecowitt/Ambient family natively; the
; 433 MHz variant hears Acurite/La Crosse/Oregon. Either tunes to the other band
; at reduced sensitivity (the matching network is built for one).
[env:heltec-v2]
board = heltec_wifi_lora_32_V2
build_flags = ${env.build_flags} '-DRF_SX1276="SX1276"' -DRF_MODULE_SCK=5 -DRF_MODULE_MISO=19 -DRF_MODULE_MOSI=27 -DRF_MODULE_CS=18 -DRF_MODULE_DIO0=26 -DRF_MODULE_DIO1=35 -DRF_MODULE_RST=14 -DOAT_BOARD_NAME='"Heltec WiFi LoRa 32 V2 (SX1276)"'

; ---- Heltec WiFi LoRa 32 V3 + external CC1101 on spare header pins ----
; The V3's SX1262 cannot demodulate OOK, so a CC1101 rides its free pins:
; SCK 5 · MISO 6 · MOSI 7 · CS 4 · GDO0 3 · GDO2 2 · 3V3 · GND
[env:heltec-v3]
board = heltec_wifi_lora_32_V3
build_flags = ${env.build_flags} '-DRF_CC1101="CC1101"' -DRF_MODULE_SCK=5 -DRF_MODULE_MISO=6 -DRF_MODULE_MOSI=7 -DRF_MODULE_CS=4 -DRF_MODULE_GDO0=3 -DRF_MODULE_GDO2=2 -DARDUINO_USB_CDC_ON_BOOT=1 -DOAT_BOARD_NAME='"Heltec WiFi LoRa 32 V3 + CC1101"'

; ---- IBC v1.02 (a one-off ESP32 controller PCB): bare 433 MHz receiver, DATA on GPIO 33 ----
; No SPI transceiver on the board, so this image runs the sketch's own pulse decoder
; (AcuRite 5-in-1 only). rtl_433_ESP is not linked: the library needs a transceiver
; it can read RSSI from. Keeps the PCB's other pins untouched (DHT22 4, 1-Wire 15,
; Serial1 16/17, Serial2 18/19, LCD 21/22, NeoPixels 23, reset 26, photoresistor 34).
[env:ibc-v102]
board = esp32dev
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.2.0
build_flags = ${env.build_flags} -DOAT_RX_DATAPIN=33 -DOAT_BOARD_NAME='"IBC v1.02 (433 MHz receiver on GPIO 33)"'

; ---- IBC v1.02 + a CC1101 on the PCB's spare pins: the full rtl_433 decoder set ----
; SCK 32 · MOSI 27 · MISO 35 (input-only is fine for MISO) · CS 25 · GDO0 33 (the old
; receiver's pad) · GDO2 36 (input-only). Leaves every other IBC pin as it was.
[env:ibc-v102-cc1101]
board = esp32dev
build_flags = ${env.build_flags} '-DRF_CC1101="CC1101"' -DRF_MODULE_SCK=32 -DRF_MODULE_MISO=35 -DRF_MODULE_MOSI=27 -DRF_MODULE_CS=25 -DRF_MODULE_GDO0=33 -DRF_MODULE_GDO2=36 -DOAT_BOARD_NAME='"IBC v1.02 + CC1101"'
