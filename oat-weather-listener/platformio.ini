; OAT Weather-Station Listener — one merged factory image per board AND per family.
;
; THREE BUILDS, ONE SOURCE (1.1.0):
;   1. bare receiver  — a 433 MHz superheterodyne module's DATA pin on one GPIO; the
;      sketch's own AcuRite 5-in-1 decoder; rtl_433_ESP is not linked. PROVEN on the bench.
;   2. on-off keying  — a CC1101 on SPI (or the SX1276 on a Heltec V2) driven by
;      rtl_433_ESP with its OOK decoder set, default band 433.92. Env names are the
;      plain board names (esp32, esp32-s3 ...), as published since 1.0.0.
;   3. FSK            — the same radios with -DOOK_MODULATION=false, default band 915.00:
;      the Fine Offset family sold as Ecowitt / Ambient Weather, La Crosse View and IT+,
;      Bresser 5/6/7-in-1. Env names end in -fsk. These chips demodulate OOK or FSK,
;      never both, so the modulation is the IMAGE and the band is a runtime SETTING.
;      Built 2026-09-18, NOT yet benched; build.sh keeps -fsk images out of the public
;      asset folder (they go to bench/) until one has heard a real sensor.
;
; rtl_433_ESP is PINNED to commit 236c816 (2026-09-02): byte-identical to the tree
; the 1.0.x images were built from (verified 2026-09-18). It tracked master before.
; Upgrade through Part 11 of the sketch publication blueprint, never by accident.
[platformio]
src_dir = .
default_envs = esp32, esp32-s3, esp32-c3, esp32-c6, heltec-v2, heltec-v3, ibc-v102, ibc-v102-cc1101, esp32-cc1101-5n1, esp32-fsk, esp32-s3-fsk, esp32-c3-fsk, esp32-c6-fsk, heltec-v2-fsk, heltec-v3-fsk, ibc-v102-cc1101-fsk, esp32-fsk-bench, esp32-cc1101-ecowitt-fsk

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
board_build.flash_mode = dio
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
extra_scripts = post:merge_bin.py
lib_extra_dirs = ../lib
lib_deps =
    https://github.com/1technophile/Arduino-Log.git#d13cd80aa02c8cf79a33ca24c554ed3331c3679f
    https://github.com/NorthernMan54/rtl_433_ESP.git#236c81659a423433e6ce75f3447efa6d4940e67d
    jgromes/RadioLib @ ^7.7.1
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.2.0
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DMQTT_MAX_PACKET_SIZE=2048
    -DOAT_MAX_SLOTS=32
    -DOAT_MEAS_PER_SLOT=8
    '-DLOG_LEVEL=LOG_LEVEL_NOTICE'
    '-DRSSI_THRESHOLD=9'

; The two families. Every board env takes one of these as its base.
[ook]
build_flags = ${env.build_flags} '-DRF_MODULE_FREQUENCY=433.92' '-DOOK_MODULATION=true'
[fsk]
build_flags = ${env.build_flags} '-DRF_MODULE_FREQUENCY=915.00' '-DOOK_MODULATION=false'

; ---- Classic ESP32 devkit + CC1101 on the standard SPI pins ----
; SCK 18 · MISO 19 · MOSI 23 · CS 5 · GDO0 22 · GDO2 4 · 3V3 · GND
[env:esp32]
board = esp32dev
build_flags = ${ook.build_flags} '-DRF_CC1101="CC1101"' -DRF_MODULE_CS=5 -DRF_MODULE_GDO0=22 -DRF_MODULE_GDO2=4 -DOAT_BOARD_NAME='"ESP32 + CC1101"'

; ---- ESP32-S3 devkit + CC1101 ----
; SCK 12 · MISO 13 · MOSI 11 · CS 10 · GDO0 9 · GDO2 8
[env:esp32-s3]
board = esp32-s3-devkitc-1
build_flags = ${ook.build_flags} '-DRF_CC1101="CC1101"' -DRF_MODULE_SCK=12 -DRF_MODULE_MISO=13 -DRF_MODULE_MOSI=11 -DRF_MODULE_CS=10 -DRF_MODULE_GDO0=9 -DRF_MODULE_GDO2=8 -DARDUINO_USB_CDC_ON_BOOT=1 -DOAT_BOARD_NAME='"ESP32-S3 + CC1101"'

; ---- ESP32-C3 devkit + CC1101 on the C3's default SPI pins ----
; SCK 4 · MISO 5 · MOSI 6 · CS 7 · GDO0 10 · GDO2 3
[env:esp32-c3]
board = esp32-c3-devkitm-1
build_flags = ${ook.build_flags} '-DRF_CC1101="CC1101"' -DRF_MODULE_SCK=4 -DRF_MODULE_MISO=5 -DRF_MODULE_MOSI=6 -DRF_MODULE_CS=7 -DRF_MODULE_GDO0=10 -DRF_MODULE_GDO2=3 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1 -DOAT_BOARD_NAME='"ESP32-C3 + CC1101"'

; ---- ESP32-C6 devkit + CC1101 on the C6's default SPI pins ----
; SCK 6 · MISO 2 · MOSI 7 · CS 18 · GDO0 10 · GDO2 11
; rtl_433_ESP names the bus VSPI on chips it does not list (C3/S3/C5 get FSPI); the
; C6 core has no VSPI, so the flag below aliases it to the C6's FSPI.
[env:esp32-c6]
board = esp32-c6-devkitc-1
build_flags = ${ook.build_flags} '-DRF_CC1101="CC1101"' -DRF_MODULE_SCK=6 -DRF_MODULE_MISO=2 -DRF_MODULE_MOSI=7 -DRF_MODULE_CS=18 -DRF_MODULE_GDO0=10 -DRF_MODULE_GDO2=11 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1 -DVSPI=FSPI -DOAT_BOARD_NAME='"ESP32-C6 + CC1101"'

; ---- Heltec WiFi LoRa 32 V2: its own SX1276 does OOK, no extra module ----
; The 433 MHz variant of the board hears Acurite/La Crosse/Oregon natively; a
; 915 MHz variant hears them at reduced sensitivity (the matching network is built
; for one band).
[env:heltec-v2]
board = heltec_wifi_lora_32_V2
build_flags = ${ook.build_flags} '-DRF_SX1276="SX1276"' -DRF_MODULE_SCK=5 -DRF_MODULE_MISO=19 -DRF_MODULE_MOSI=27 -DRF_MODULE_CS=18 -DRF_MODULE_DIO0=26 -DRF_MODULE_DIO1=35 -DRF_MODULE_RST=14 -DOAT_BOARD_NAME='"Heltec WiFi LoRa 32 V2 (SX1276)"'

; ---- Heltec WiFi LoRa 32 V3 + external CC1101 on spare header pins ----
; The V3's SX1262 cannot demodulate OOK, so a CC1101 rides its free pins. V3 ONLY: on a
; Heltec V4, GPIO 2, 5 and 7 belong to the LoRa front-end module, so this map must not be
; flashed to a V4 (there is no V4 listener image yet).
; SCK 5 · MISO 6 · MOSI 7 · CS 4 · GDO0 3 · GDO2 2 · 3V3 · GND
[env:heltec-v3]
board = heltec_wifi_lora_32_V3
build_flags = ${ook.build_flags} '-DRF_CC1101="CC1101"' -DRF_MODULE_SCK=5 -DRF_MODULE_MISO=6 -DRF_MODULE_MOSI=7 -DRF_MODULE_CS=4 -DRF_MODULE_GDO0=3 -DRF_MODULE_GDO2=2 -DARDUINO_USB_CDC_ON_BOOT=1 -DOAT_BOARD_NAME='"Heltec WiFi LoRa 32 V3 + CC1101"'

; ---- IBC v1.02 (a one-off ESP32 controller PCB): bare 433 MHz receiver, DATA on GPIO 33 ----
; No SPI transceiver on the board, so this image runs the sketch's own AcuRite
; 5-in-1 decoder (from 1.3.0 the bit-clock decoder build 4 proved; 1.1.x was width-only). rtl_433_ESP is not linked: the library needs a transceiver
; it can read RSSI from. Keeps the PCB's other pins untouched (DHT22 4, 1-Wire 15,
; Serial1 16/17, Serial2 18/19, LCD 21/22, NeoPixels 23, reset 26, photoresistor 34).
[env:ibc-v102]
board = esp32dev
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.2.0
build_flags = ${ook.build_flags} -DOAT_RX_DATAPIN=33 -DOAT_BOARD_NAME='"IBC v1.02 (433 MHz receiver on GPIO 33)"'

; ---- IBC v1.02 + a CC1101 on the PCB's spare pins: the full rtl_433 decoder set ----
; SCK 32 · MOSI 27 · MISO 35 (input-only is fine for MISO) · CS 25 · GDO0 33 (the old
; receiver's pad) · GDO2 36 (input-only). Leaves every other IBC pin as it was.
[env:ibc-v102-cc1101]
board = esp32dev
build_flags = ${ook.build_flags} '-DRF_CC1101="CC1101"' -DRF_MODULE_SCK=32 -DRF_MODULE_MISO=35 -DRF_MODULE_MOSI=27 -DRF_MODULE_CS=25 -DRF_MODULE_GDO0=33 -DRF_MODULE_GDO2=36 -DOAT_BOARD_NAME='"IBC v1.02 + CC1101"'

; =============================================================================
; FSK twins (1.1.0). Same pins as the env each is named for; only the family base
; and the board name differ. NOT yet benched.
; =============================================================================
[env:esp32-fsk]
board = esp32dev
build_flags = ${fsk.build_flags} '-DRF_CC1101="CC1101"' -DRF_MODULE_CS=5 -DRF_MODULE_GDO0=22 -DRF_MODULE_GDO2=4 -DOAT_BOARD_NAME='"ESP32 + CC1101 (FSK)"'

[env:esp32-s3-fsk]
board = esp32-s3-devkitc-1
build_flags = ${fsk.build_flags} '-DRF_CC1101="CC1101"' -DRF_MODULE_SCK=12 -DRF_MODULE_MISO=13 -DRF_MODULE_MOSI=11 -DRF_MODULE_CS=10 -DRF_MODULE_GDO0=9 -DRF_MODULE_GDO2=8 -DARDUINO_USB_CDC_ON_BOOT=1 -DOAT_BOARD_NAME='"ESP32-S3 + CC1101 (FSK)"'

[env:esp32-c3-fsk]
board = esp32-c3-devkitm-1
build_flags = ${fsk.build_flags} '-DRF_CC1101="CC1101"' -DRF_MODULE_SCK=4 -DRF_MODULE_MISO=5 -DRF_MODULE_MOSI=6 -DRF_MODULE_CS=7 -DRF_MODULE_GDO0=10 -DRF_MODULE_GDO2=3 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1 -DOAT_BOARD_NAME='"ESP32-C3 + CC1101 (FSK)"'

[env:esp32-c6-fsk]
board = esp32-c6-devkitc-1
build_flags = ${fsk.build_flags} '-DRF_CC1101="CC1101"' -DRF_MODULE_SCK=6 -DRF_MODULE_MISO=2 -DRF_MODULE_MOSI=7 -DRF_MODULE_CS=18 -DRF_MODULE_GDO0=10 -DRF_MODULE_GDO2=11 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1 -DVSPI=FSPI -DOAT_BOARD_NAME='"ESP32-C6 + CC1101 (FSK)"'

; Built so the source stays honest about the V2; not offered until a V2 has heard an FSK sensor.
[env:heltec-v2-fsk]
board = heltec_wifi_lora_32_V2
build_flags = ${fsk.build_flags} '-DRF_SX1276="SX1276"' -DRF_MODULE_SCK=5 -DRF_MODULE_MISO=19 -DRF_MODULE_MOSI=27 -DRF_MODULE_CS=18 -DRF_MODULE_DIO0=26 -DRF_MODULE_DIO1=35 -DRF_MODULE_RST=14 -DOAT_BOARD_NAME='"Heltec WiFi LoRa 32 V2 (SX1276, FSK)"'

[env:heltec-v3-fsk]
board = heltec_wifi_lora_32_V3
build_flags = ${fsk.build_flags} '-DRF_CC1101="CC1101"' -DRF_MODULE_SCK=5 -DRF_MODULE_MISO=6 -DRF_MODULE_MOSI=7 -DRF_MODULE_CS=4 -DRF_MODULE_GDO0=3 -DRF_MODULE_GDO2=2 -DARDUINO_USB_CDC_ON_BOOT=1 -DOAT_BOARD_NAME='"Heltec WiFi LoRa 32 V3 + CC1101 (FSK)"'

[env:ibc-v102-cc1101-fsk]
board = esp32dev
build_flags = ${fsk.build_flags} '-DRF_CC1101="CC1101"' -DRF_MODULE_SCK=32 -DRF_MODULE_MISO=35 -DRF_MODULE_MOSI=27 -DRF_MODULE_CS=25 -DRF_MODULE_GDO0=33 -DRF_MODULE_GDO2=36 -DOAT_BOARD_NAME='"IBC v1.02 + CC1101 (FSK)"'

; Bench only, never published: the classic-ESP32 FSK image with the library's heap
; reporting on, for the 24-hour soak.
[env:esp32-fsk-bench]
board = esp32dev
build_flags = ${fsk.build_flags} '-DRF_CC1101="CC1101"' -DRF_MODULE_CS=5 -DRF_MODULE_GDO0=22 -DRF_MODULE_GDO2=4 -DMEMORY_DEBUG -DOAT_BOARD_NAME='"ESP32 + CC1101 (FSK, bench: heap reporting)"'

; =============================================================================
; DIAGNOSTIC build (2026-09-20). The classic-ESP32 OOK image plus the two things
; the shipped images compile OUT: the CC1101 register dump at init
; (RF_MODULE_INIT_STATUS) and the library's INFO/DEBUG logging, which is gated at
; COMPILE time — alogprintf(LOG_INFO) vanishes at our default LOG_LEVEL_NOTICE, so
; calling getModuleStatus() from a console command on a shipped image prints
; nothing. TRACE also turns on the per-capture pulse-count line, which says how
; many edges each RSSI crossing actually carried. Bench only; never in default_envs.
; =============================================================================
[env:esp32-diag]
board = esp32dev
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DMQTT_MAX_PACKET_SIZE=2048
    -DOAT_MAX_SLOTS=32
    -DOAT_MEAS_PER_SLOT=8
    '-DLOG_LEVEL=LOG_LEVEL_TRACE'
    '-DRSSI_THRESHOLD=9'
    '-DRF_MODULE_FREQUENCY=433.92'
    '-DOOK_MODULATION=true'
    '-DRF_CC1101="CC1101"'
    -DRF_MODULE_CS=5
    -DRF_MODULE_GDO0=22
    -DRF_MODULE_GDO2=4
    -DRF_MODULE_INIT_STATUS
    -DOAT_BOARD_NAME='"ESP32 + CC1101 (DIAG)"'

; ---- OOK AGC fix builds (2026-09-20) --------------------------------------
; TI Design Note DN022 (SWRA215E) §3.1: SmartRF's register sets are optimised for
; 2-FSK, and "only changing the modulation format to OOK/ASK" leaves AGC settings
; that "result in unstable or non-optimum reception". TI's OOK range is
; AGCCTRL2 0x03-0x07, AGCCTRL1 0x00, AGCCTRL0 0x91/0x92. rtl_433_ESP ships
; 0xC7/0x40/0xB2 — all three outside it. Two mechanisms: AGCCTRL2 MAX_DVGA_GAIN=0b11
; raises the carrier-sense floor ~18 dB (datasheet Table 33: -79.5 vs -97.5 dBm), and
; AGCCTRL0 FILTER_LENGTH=0b10 sets a 12 dB ASK decision boundary, so the slicer never
; toggles and GDO0 stays flat. rtl_433_ESP#208 measured exactly this: 0xC7 = flat RSSI
; and zero events; 0x03 = 24 events in 30 s. The FSK path writes NO AGC registers at
; all, which is why the same board is edge-rich in FSK and flat in OOK.
; esp32-agc = the minimal change with field evidence. esp32-ti = full DN022.

[env:esp32-agc]
board = esp32dev
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DMQTT_MAX_PACKET_SIZE=2048
    -DOAT_MAX_SLOTS=32
    -DOAT_MEAS_PER_SLOT=8
    '-DLOG_LEVEL=LOG_LEVEL_TRACE'
    '-DRSSI_THRESHOLD=9'
    '-DRF_MODULE_FREQUENCY=433.92'
    '-DOOK_MODULATION=true'
    '-DRF_CC1101="CC1101"'
    -DRF_MODULE_CS=5
    -DRF_MODULE_GDO0=22
    -DRF_MODULE_GDO2=4
    -DCC1101_AGCCTRL2=0x03
    -DRF_MODULE_INIT_STATUS
    -DOAT_BOARD_NAME='"ESP32 + CC1101 (AGC 0x03)"'

[env:esp32-ti]
board = esp32dev
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DMQTT_MAX_PACKET_SIZE=2048
    -DOAT_MAX_SLOTS=32
    -DOAT_MEAS_PER_SLOT=8
    '-DLOG_LEVEL=LOG_LEVEL_TRACE'
    '-DRSSI_THRESHOLD=9'
    '-DRF_MODULE_FREQUENCY=433.92'
    '-DOOK_MODULATION=true'
    '-DRF_CC1101="CC1101"'
    -DRF_MODULE_CS=5
    -DRF_MODULE_GDO0=22
    -DRF_MODULE_GDO2=4
    -DCC1101_AGCCTRL2=0x03
    -DCC1101_AGCCTRL1=0x00
    -DCC1101_AGCCTRL0=0x91
    -DCC1101_RX_BANDWIDTH=203.125
    -DRF_MODULE_INIT_STATUS
    -DOAT_BOARD_NAME='"ESP32 + CC1101 (TI DN022)"'

; ---- LIVE TUNING build (2026-09-20) ---------------------------------------
; CC1101_OOK_TUNING unlocks the library's register accessors (setCC1101Register /
; getCC1101Register / setRxBandwidth / receiveDirect), which the sketch wires to the
; console commands `reg`, `bw` and `regs`. Sweep AGC and bandwidth profiles live
; instead of one rebuild-reflash-repair cycle per guess. Bench only.
[env:esp32-tune]
board = esp32dev
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DMQTT_MAX_PACKET_SIZE=2048
    -DOAT_MAX_SLOTS=32
    -DOAT_MEAS_PER_SLOT=8
    '-DLOG_LEVEL=LOG_LEVEL_TRACE'
    '-DRSSI_THRESHOLD=9'
    '-DRF_MODULE_FREQUENCY=433.92'
    '-DOOK_MODULATION=true'
    '-DRF_CC1101="CC1101"'
    -DRF_MODULE_CS=5
    -DRF_MODULE_GDO0=22
    -DRF_MODULE_GDO2=4
    -DCC1101_AGCCTRL2=0x03
    -DCC1101_AGCCTRL1=0x00
    -DCC1101_AGCCTRL0=0x91
    -DCC1101_RX_BANDWIDTH=203.125
    -DCC1101_OOK_TUNING
    -DPUBLISH_UNPARSED
    ; Glitch filter. The bench capture matched acurite_txr exactly (220/408/620 us)
    ; but was peppered with 51-116 us transitions that split real bits. The ISR only
    ; updates _lastChange when a pulse is ACCEPTED, so raising the floor above the
    ; glitches merges them back into the surrounding pulse instead of dropping data.
    ; 130 sits well under AcuRite's shortest real element (204 us gap) and well over
    ; every glitch observed. The library README names this flag as the thing to check
    ; when the data pin toggles but no events are reported.
    -DMINIMUM_PULSE_LENGTH=130
    -DRF_MODULE_INIT_STATUS
    -DOAT_BOARD_NAME='"ESP32 + CC1101 (TUNE)"'

; ---- WH51 diagnostic build (2026-09-20) ------------------------------------
; Lifted from the library's own esp32_cc1101_FSK_no_pretrigger example, whose
; comment reads: "FSK regression environment using the legacy capture path. WH51
; decoder diagnostics are enabled to identify preamble, length, checksum, and CRC
; failures". Two flags carry that:
;   RTL_VERBOSE=43       devices[43] is fineoffset_WH51 (signalDecoder.cpp:368), so
;                        this prints WH51-specific decode failures WITHOUT the flood
;                        of every other decoder.
;   PRETRIGGER_ENABLED=0 the legacy capture path. The maintainer keeps a WH51
;                        regression env on it, which implies the pre-trigger capture
;                        has given WH51 trouble; worth having as the fallback.
; Note the maintainer's reference FSK env sets NO AGC or bandwidth overrides at all —
; the FSK path never writes those registers. Our esp32-fsk env already matches it.
; Default band is 915.00: the WH51s on this bench are 915 (US), established by test
; on 2026-09-20 — the FSK image at 433.92 on a well-matched 433 module produced 1763
; captures and zero messages. The image is built for the 915 module; the 433 module
; on the bench cannot reach a 915 sensor at any band setting, so there is nothing to
; default to 433 FOR.
[env:esp32-wh51]
board = esp32dev
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DMQTT_MAX_PACKET_SIZE=2048
    -DOAT_MAX_SLOTS=32
    -DOAT_MEAS_PER_SLOT=8
    '-DLOG_LEVEL=LOG_LEVEL_TRACE'
    '-DRSSI_THRESHOLD=9'
    '-DRF_MODULE_FREQUENCY=915.00'
    '-DOOK_MODULATION=false'
    '-DRF_CC1101="CC1101"'
    -DRF_MODULE_CS=5
    -DRF_MODULE_GDO0=22
    -DRF_MODULE_GDO2=4
    ; RTL_DEBUG=1 makes EVERY decoder report its own rejection reason, not just the
    ; WH51's. Needed because the bench is now hearing three Fine Offset devices that
    ; all share the aa-aa-aa/2d-d4 preamble: WH51 soil (family 0x51), WH31 temp+RH
    ; (0x30) and WN34 temp probe (0x34). With only RTL_VERBOSE=43 we were watching the
    ; WH51 decoder complain about a WN34 packet. Level 1 and not 2 on purpose: level 2
    ; prints bit-width tuning for every FSK decoder that touches a packet and buries
    ; the useful lines.
    ; NARROWED from RTL_DEBUG=1 (all decoders) to RTL_VERBOSE=1 — devices[1] is
    ; ambientweather_wh31e, the decoder that now reports "bad SUM" on the bench WH31B.
    ; RTL_DEBUG=1 printed ~40 lines per packet from every decoder, and PUBLISH_UNPARSED
    ; added a full RAW dump. Serial at 115200 is BLOCKING: ~10 ms a line, so a packet
    ; could cost seconds of stalled output. The capture ISR has to service a 58 us bit,
    ; ~17,000 edges/sec, so the diagnostics themselves are a plausible source of the
    ; residual bit slips we are now chasing. Quieter build = fewer stalls to blame.
    -DRTL_VERBOSE=1
    -DPRETRIGGER_ENABLED=0
    -DCC1101_OOK_TUNING
    -DRF_MODULE_INIT_STATUS
    -DOAT_BOARD_NAME='"ESP32 + CC1101 (WH51 DIAG)"'

; =============================================================================
; BUILD 4 (1.2.0, bench): the CC1101 as the receiver, the sketch's own AcuRite
; 5-in-1 decoder. Same wiring as the esp32 image and the 2026-09-20 bench:
; SCK 18 · MISO 19 · MOSI 23 · CS 5 · GDO0 22 · GDO2 4 · 3V3 · GND.
; The sketch writes the CC1101's registers itself (TI DN022 on-off-keying gain) and
; reads GDO0 as a data pin; rtl_433_ESP and RadioLib are not linked. Published on
; the main page since 2026-10-24: gweather-2 has decoded two AcuRite Iris stations on
; it since 2026-09-26, and it hears the farther one far more often than a bare receiver.
; =============================================================================
[env:esp32-cc1101-5n1]
board = esp32dev
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.2.0
build_flags = ${ook.build_flags} -DOAT_RX_DATAPIN=22 -DOAT_RX_CC1101 -DRF_MODULE_SCK=18 -DRF_MODULE_MISO=19 -DRF_MODULE_MOSI=23 -DRF_MODULE_CS=5 -DOAT_BOARD_NAME='"ESP32 + CC1101 (AcuRite 5-in-1, own decoder)"'

; Bench twins (1.3.0): the same images plus the live-tuning and capture commands
; (-DOAT_RX_BENCH: capture, win, glitch, spike; on the CC1101 also reg, bw, drate).
; Never offered on the main page.
[env:esp32-cc1101-5n1-bench]
board = esp32dev
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.2.0
build_flags = ${ook.build_flags} -DOAT_RX_DATAPIN=22 -DOAT_RX_CC1101 -DOAT_RX_BENCH -DRF_MODULE_SCK=18 -DRF_MODULE_MISO=19 -DRF_MODULE_MOSI=23 -DRF_MODULE_CS=5 -DOAT_BOARD_NAME='"ESP32 + CC1101 (AcuRite 5-in-1, own decoder, bench)"'

; ---- Build 5 (1.4.0, bench): Ecowitt FSK through a 915 MHz CC1101 in packet mode ----
; lib/oat_rf915: the chip syncs on 2d d4 and frames in hardware; our WH31 / WH51 /
; WN34 decoders. rtl_433_ESP and RadioLib are not linked. Only SPI is wired:
; SCK 18 · MISO 19 · MOSI 23 · CS 5 · 3V3 · GND (GDO0 / GDO2 not read).
; The name ends in -fsk, so build.sh files it under bench/ until it has heard a sensor.
[env:esp32-cc1101-ecowitt-fsk]
board = esp32dev
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.2.0
build_flags = ${env.build_flags} '-DRF_MODULE_FREQUENCY=915.00' -DOAT_RX_FSK915 -DRF_MODULE_SCK=18 -DRF_MODULE_MISO=19 -DRF_MODULE_MOSI=23 -DRF_MODULE_CS=5 -DOAT_BOARD_NAME='"ESP32 + CC1101 915 (Ecowitt, packet mode)"'

[env:ibc-v102-bench]
board = esp32dev
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.2.0
build_flags = ${ook.build_flags} -DOAT_RX_DATAPIN=33 -DOAT_RX_BENCH -DOAT_BOARD_NAME='"IBC v1.02 (433 MHz receiver on GPIO 33, bench)"'
