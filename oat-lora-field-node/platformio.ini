; OAT LoRa Field Node — one merged factory image per Heltec board.
; The board IS the chip choice here: the LoRa radio is soldered on, so the image is
; built for the exact board and the web installer matches it by chip family
; (classic ESP32 = V2, ESP32-S3 = V3). Same pinning rules as every OAT sketch:
; DIO boot mode, a 4 MB flash header (both Heltecs carry 8 MB; the header must
; never exceed the chip and 4 MB matches huge_app.csv), merge_bin post-step.
[platformio]
src_dir = .
default_envs = heltec-v3, heltec-v4, heltec-v2

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
board_build.flash_mode = dio
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
extra_scripts = post:merge_bin.py
lib_extra_dirs = ../lib
lib_deps =
    jgromes/RadioLib @ ^7.1.0
    olikraus/U8g2 @ ^2.36.0
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^4.0.4
build_flags =
    -DCORE_DEBUG_LEVEL=1

; ---- Heltec WiFi LoRa 32 V2 / V2.1: classic ESP32 + SX1276 (CP2102 USB, may need a driver) ----
[env:heltec-v2]
board = heltec_wifi_lora_32_V2
build_flags = ${env.build_flags} -DOAT_BOARD_HELTEC_V2

; ---- Heltec WiFi LoRa 32 V3: ESP32-S3 + SX1262 (native USB) ----
; USB CDC on boot so `Serial` (the console) rides the USB port the user plugged in.
[env:heltec-v3]
board = heltec_wifi_lora_32_V3
build_flags = ${env.build_flags} -DOAT_BOARD_HELTEC_V3 -DARDUINO_USB_CDC_ON_BOOT=1

; ---- Heltec WiFi LoRa 32 V4: ESP32-S3 + SX1262 + RF front-end module (PA/LNA) ----
; Same chip family as the V3 (the installer cannot tell them apart), a different
; radio path: the front end must be powered and driven or the board is deaf and
; mute. There is no V4 board definition in this platform release; the V3's
; (ESP32-S3, native USB) is the right base and the pin map comes from our header.
[env:heltec-v4]
board = heltec_wifi_lora_32_V3
build_flags = ${env.build_flags} -DOAT_BOARD_HELTEC_V4 -DARDUINO_USB_CDC_ON_BOOT=1
