; OAT Load-Cell Water — gravimetric irrigation node (load cell + HX711) -> oat-ods.
; Weighs a pot/basket, emits weight + a transpiration estimate (drydown slope),
; and runs a LOCAL weigh-and-water loop: water when below a target weight, stop at
; a refill target or a hard pump-time cap. The watering DECISION is entirely on
; the device — no cloud in the actuation path (oat-ods carries readings only).
;
; PLATFORM PIN — VERIFY ON FIRST BUILD: bump the pioarduino release tag if needed.

[platformio]
src_dir = .
default_envs = esp32, esp32-s3, esp32-c3, esp32-c6

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
extra_scripts = post:merge_bin.py
lib_extra_dirs = ../lib
lib_deps =
    bogde/HX711 @ ^0.7.5
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.2.0
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DMQTT_MAX_PACKET_SIZE=2048

[env:esp32]
board = esp32dev
[env:esp32-s3]
board = esp32-s3-devkitc-1
[env:esp32-c3]
board = esp32-c3-devkitm-1
[env:esp32-c6]
board = esp32-c6-devkitc-1
