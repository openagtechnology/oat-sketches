; OAT BLE Listener — multi-chip firmware build
; -----------------------------------------------------------------------------
; One source, ONE merged factory image per chip family. The OAT web installer
; (ESP Web Tools) reads the chip on the wire and auto-picks the matching build,
; so a grower never chooses a chip. merge_bin.py turns each env's artifacts into
; a single firmware-<mcu>.bin flashable at offset 0; build.sh assembles them +
; manifest.json into the site assets.
;
; SUPPORT BROAD, RECOMMEND NARROW: we build classic ESP32 too (don't turn away
; someone who already owns one), but the site's buy-list recommends the native-
; USB chips (S3 / C3 / C6) — no USB-serial driver to install, the #1 newbie wall.
;
; Capability filter: this firmware needs WiFi *and* BLE. That rules out S2 (no
; Bluetooth), H2 (no WiFi) and P4 (no radio) — they are intentionally absent.
;
; PLATFORM PIN — VERIFY ON FIRST BUILD: pioarduino's espressif32 tracks
; Arduino-ESP32 3.x (ESP-IDF 5.x), which NimBLE-Arduino 2.x needs and which
; brings C3/C6/S3 native USB. The stock platformio "espressif32" lagged on the
; newer chips. Confirm the latest release tag at
;   https://github.com/pioarduino/platform-espressif32/releases
; and bump the URL below if the build can't resolve it.

[platformio]
src_dir = .
default_envs = esp32, esp32-s3, esp32-c3, esp32-c6

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
; NimBLE + Theengs + WiFi + MQTT + WebServer is ~1.7 MB — too big for the default
; 1.25 MB app slot (esp32/c3/c6 overflow). huge_app gives a 3 MB app, no OTA,
; which is right since this firmware reflashes from the browser, not over the air.
board_build.partitions = huge_app.csv
; Force DIO flash mode on EVERY chip. The native-USB devkits (C3/C6/S3) default to
; QIO, but QIO is NOT a valid ROM *boot* mode — the ROM must read the bootloader in
; DIO first. Boards whose flash can't be read back in QIO flash fine but then loop at
; the ROM stage (rst:0x7 TG0_WDT, never reaching the app) — exactly what a C6 devkit
; did here. DIO boots on every flash chip; the speed cost is nil for this firmware.
; (The classic ESP32 already defaults to DIO, so this is a no-op there.)
board_build.flash_mode = dio
; Pin a 4 MB flash-size header on every build. The C6/S3 devkit board files assume
; 8 MB, but the header's size must not exceed the *actual* chip: an 8 MB header on a
; 4 MB C6 fails the boot-time flash probe (assert __esp_system_init_fn_init_flash) and
; panics. 4 MB matches huge_app.csv's layout and boots on any board with >=4 MB flash
; (the app is ~1.7 MB, so unused flash above 4 MB costs nothing).
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
extra_scripts = post:merge_bin.py
; shared OAT encoder module lives one level up at firmware/lib/oat_ods
lib_extra_dirs = ../lib
lib_deps =
    h2zero/NimBLE-Arduino @ ^2.2.3
    theengs/TheengsDecoder @ ^1.8.0
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.2.0
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DOAT_MAX_SLOTS=24          ; unique BLE devices tracked
    -DOAT_MEAS_PER_SLOT=6       ; a device can broadcast several values
    -DMQTT_MAX_PACKET_SIZE=2048

; ---- Classic ESP32 (external USB-UART bridge: CP2102 / CH340 -> may need a driver) ----
[env:esp32]
board = esp32dev

; USB CDC on the USB-Serial/JTAG chips (C3/C6): we enable ARDUINO_USB_CDC_ON_BOOT so
; `Serial` — the two-way setup Console AND the logs — rides the USB port the user
; already plugged in. Without it, Serial falls back to the UART pins and the Console
; is unreachable from the browser: you can't configure a native-USB node over USB and
; its log never appears. (S3 left on its default for now; it uses USB-OTG, a separate path.)

; ---- ESP32-S3 (native USB, no driver) ----
[env:esp32-s3]
board = esp32-s3-devkitc-1

; ---- ESP32-C3 (native USB, no driver) ----
[env:esp32-c3]
board = esp32-c3-devkitm-1
build_flags = ${env.build_flags} -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

; ---- ESP32-C6 (native USB, no driver; WiFi 6 + BLE 5) ----
[env:esp32-c6]
board = esp32-c6-devkitc-1
build_flags = ${env.build_flags} -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
